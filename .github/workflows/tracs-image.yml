name: TRACS image

# Builds the portable TRACS image (containers/tracs/Dockerfile), proves it runs on an
# old CPU, and pushes it to GHCR from main. The pipeline's default TRACS container.
on:
  push:
    branches: [main]
    paths:
      - containers/tracs/**
      - bin/tracs_smoke_test.py
      - .github/workflows/tracs-image.yml
  pull_request:
    paths:
      - containers/tracs/**
      - bin/tracs_smoke_test.py
      - .github/workflows/tracs-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tracs
  TRACS_VERSION: 1.1.1
  TRACS_MARCH: x86-64-v2
  # Oldest CPU the image must run on. Nehalem (2008) is the x86-64-v2 baseline.
  TEST_CPU: Nehalem
  # Known non-portable image, used to prove the emulated-CPU test can fail.
  CONTROL_IMAGE: quay.io/biocontainers/tracs:1.1.1--py312h0c6b66a_0

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: containers/tracs
          platforms: linux/amd64
          build-args: |
            TRACS_VERSION=${{ env.TRACS_VERSION }}
            TRACS_MARCH=${{ env.TRACS_MARCH }}
          load: true
          tags: tracs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extension contains no AVX/AVX-512 instructions
        run: |
          docker run --rm tracs:test bash -c '
            so=$(python -c "import TRACS; print(TRACS.__file__)")
            objdump=$(ls /opt/conda/bin/*-linux-gnu-objdump | head -1)
            n=$("$objdump" -d "$so" | grep -cE "%[yz]mm[0-9]" || true)
            echo "$so: $n ymm/zmm instruction(s)"
            [ "$n" -eq 0 ]'

      - name: Install qemu user-mode emulator
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static

      - name: Control - non-portable image must SIGILL on ${{ env.TEST_CPU }}
        run: |
          set +e
          docker run --rm -v /usr/bin/qemu-x86_64-static:/qemu:ro -v "$PWD/bin:/smoke:ro" \
            "$CONTROL_IMAGE" /qemu -cpu "$TEST_CPU" /usr/local/bin/python /smoke/tracs_smoke_test.py
          rc=$?
          echo "control exit status: $rc"
          [ "$rc" -eq 132 ]

      - name: Smoke test on ${{ env.TEST_CPU }}
        run: |
          docker run --rm -v /usr/bin/qemu-x86_64-static:/qemu:ro -v "$PWD/bin:/smoke:ro" \
            tracs:test /qemu -cpu "$TEST_CPU" /opt/conda/bin/python /smoke/tracs_smoke_test.py

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: containers/tracs
          platforms: linux/amd64
          build-args: |
            TRACS_VERSION=${{ env.TRACS_VERSION }}
            TRACS_MARCH=${{ env.TRACS_MARCH }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TRACS_VERSION }}-${{ env.TRACS_MARCH }}
            ${{ env.IMAGE }}:${{ env.TRACS_VERSION }}-${{ env.TRACS_MARCH }}-${{ github.sha }}
          cache-from: type=gha
